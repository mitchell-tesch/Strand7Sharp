name: release

# Tag-triggered NuGet publish using **Trusted Publishing** (OIDC).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'         # v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-*'       # v1.2.3-preview.1, v1.2.3-rc.2, etc.
  workflow_dispatch:

permissions:
  contents: write   # needed for softprops/action-gh-release
  id-token: write   # needed to mint the OIDC token for NuGet Trusted Publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    # The `release` environment is referenced in the nuget.org Trusted Publisher
    # policy. It also gives you a place to add required reviewers / wait timers
    # / environment-scoped variables if you want manual approval gates later.
    environment: release

    steps:
      - uses: actions/checkout@v4
        with:
          # SourceLink needs commit history + the working repo SHA.
          fetch-depth: 0

      - name: Setup .NET (pinned via global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like 'refs/tags/v*') {
            $tag = $ref -replace '^refs/tags/', ''
            $version = $tag.TrimStart('v')
            "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Releasing version $version (tag $tag)"
          } else {
            "tag="    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "version="| Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Manual dispatch — using <Version> from csproj"
          }

      - name: Verify csproj <Version> matches tag
        if: steps.ver.outputs.version != ''
        shell: pwsh
        run: |
          [xml]$proj = Get-Content Strand7Sharp/Strand7Sharp.csproj
          $csprojVersion = ($proj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          $tagVersion    = '${{ steps.ver.outputs.version }}'
          if ($csprojVersion -ne $tagVersion) {
            Write-Error "Version mismatch: csproj <Version> is '$csprojVersion' but tag is 'v$tagVersion'. Bump the csproj or retag."
            exit 1
          }
          Write-Host "csproj <Version> ($csprojVersion) matches tag (v$tagVersion)."

      - name: Restore
        run: dotnet restore Strand7Sharp.sln

      - name: Build (Release)
        # St7API.dll is NOT required at build time — P/Invoke resolves at runtime.
        run: dotnet build Strand7Sharp.sln -c Release --no-restore /warnaserror

      - name: Verify generated code is up to date
        shell: pwsh
        run: |
          ./tools/Inject-XmlDocs.ps1
          ./tools/Generate-Wrapper.ps1
          $changed = git status --porcelain -- 'Strand7Sharp/Interop/St7API.cs' 'Strand7Sharp/Generated/St7Native.g.cs'
          if ($changed) {
            git --no-pager diff -- 'Strand7Sharp/Interop/St7API.cs' 'Strand7Sharp/Generated/St7Native.g.cs'
            Write-Error "Generated files are out of date. Re-run tools/Inject-XmlDocs.ps1 and tools/Generate-Wrapper.ps1 and commit the result.`n$changed"
            exit 1
          }

      - name: Pack
        run: dotnet pack Strand7Sharp/Strand7Sharp.csproj -c Release --no-build -o artifacts

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: Strand7Sharp-nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Push to nuget.org (Trusted Publishing / OIDC)
        # NuGet/login exchanges the GitHub OIDC token for a short-lived API key
        # (valid ~15 min) that matches the Trusted Publisher policy you set up
        # on nuget.org. The key is exposed via the `NUGET_API_KEY` step output.
        # See: https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: dotnet nuget push
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # PowerShell does NOT expand globs before passing args to native
          # executables, and `dotnet nuget push` on Windows doesn't expand
          # them either — so we resolve the files ourselves and push each.
          $packages = Get-ChildItem -Path artifacts -Filter *.nupkg -File
          if (-not $packages) {
            Write-Error "No .nupkg found under artifacts/."
            exit 1
          }
          foreach ($pkg in $packages) {
            Write-Host "Pushing $($pkg.Name)"
            # Pushing the .nupkg auto-pushes the side-by-side .snupkg to symbols.nuget.org.
            # --skip-duplicate makes re-runs of the same tag safe (e.g. after a transient failure).
            dotnet nuget push $pkg.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              Write-Error "dotnet nuget push failed for $($pkg.Name) (exit $LASTEXITCODE)."
              exit $LASTEXITCODE
            }
          }

      - name: Extract CHANGELOG section for this version
        if: steps.ver.outputs.tag != ''
        id: changelog
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $path    = 'CHANGELOG.md'
          if (-not (Test-Path $path)) {
            Write-Error "CHANGELOG.md not found at repo root."
            exit 1
          }

          # Grab everything between '## [<version>]' and the next '## [' heading
          # (Keep-a-Changelog format). Trailing link-reference lines like
          # '[0.1.0]: https://...' at the very bottom are excluded automatically
          # because they don't start with '## ['.
          $content = Get-Content $path -Raw
          $pattern = "(?ms)^##\s*\[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^##\s*\[|\Z)"
          $m = [regex]::Match($content, $pattern)
          if (-not $m.Success) {
            Write-Error "No '## [$version]' section found in CHANGELOG.md. Add one before tagging."
            exit 1
          }
          $body = $m.Groups[1].Value.TrimEnd()

          # Prepend a link back to the full changelog for context.
          $header = "_See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.ver.outputs.tag }}/CHANGELOG.md) for the full history._`n`n"
          $body   = $header + $body

          # Write to a file and pass its path through GITHUB_OUTPUT (multi-line
          # output values are awkward to escape inline).
          $out = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $out -Value $body -Encoding utf8
          "path=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "----- Release notes -----"
          Write-Host $body
          Write-Host "-------------------------"

      - name: Create GitHub Release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Strand7Sharp ${{ steps.ver.outputs.version }}
          draft: true
          body_path: ${{ steps.changelog.outputs.path }}
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg




