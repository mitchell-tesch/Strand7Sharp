<?xml version="1.0" encoding="UTF-8"?>
<!--
  Strand7Sharp package icon.

  Design notes:
    * Inspired by the Strand7 colour palette (engineering navy + signal orange) but
      deliberately not a copy of any trademarked Strand7 mark.
    * A stylised "7" rendered as a 2-beam truss with circular node markers at every
      vertex/joint — instantly readable as both a digit and an FEA element.
    * A "C#"-purple disc bearing a sharp glyph in the bottom-right corner, the
      standard cue for ".NET / C# library" on nuget.org.
    * Designed in a 256×256 viewBox so the same source rasterises cleanly to the
      128×128 PNG that NuGet recommends.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Engineering-navy background gradient. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2444"/>
      <stop offset="1" stop-color="#1A4A7A"/>
    </linearGradient>

    <!-- Subtle inner highlight along the top edge. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop shadow under the truss beams. -->
    <filter id="beamShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded-square background. -->
  <rect x="0" y="0" width="256" height="256" rx="44" ry="44" fill="url(#bg)"/>
  <rect x="0" y="0" width="256" height="256" rx="44" ry="44" fill="url(#sheen)"/>

  <!-- ============================================================
       "7" as a 2-beam truss
       Vertices:
         A = top-left   (60,  72)
         B = top-right  (188, 72)   <- elbow / shared joint
         C = bottom     (108, 200)
       ============================================================ -->
  <g filter="url(#beamShadow)">
    <!-- Beam 1: A -> B (top chord) -->
    <line x1="60"  y1="72"  x2="188" y2="72"  stroke="#F2F6FB" stroke-width="18" stroke-linecap="round"/>
    <!-- Beam 2: B -> C (diagonal) -->
    <line x1="188" y1="72"  x2="108" y2="200" stroke="#F2F6FB" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Node markers (orange — Strand7-style signal accent). -->
  <g>
    <circle cx="60"  cy="72"  r="13" fill="#FF8A1E" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="188" cy="72"  r="13" fill="#FF8A1E" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="108" cy="200" r="13" fill="#FF8A1E" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- ============================================================
       C# badge (bottom-right corner).
       Microsoft C# brand purple: #512BD4
       ============================================================ -->
  <g transform="translate(198,198)">
    <!-- Disc + thin white ring for separation from the navy background. -->
    <circle cx="0" cy="0" r="40" fill="#512BD4"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FFFFFF" stroke-width="3"/>

    <!--
      Sharp glyph (♯), drawn as two pairs of crossing strokes so it stays crisp at
      small sizes. Italic-style slant matches the conventional C# wordmark.
    -->
    <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" transform="skewX(-12)">
      <!-- Two horizontal bars. -->
      <line x1="-18" y1="-8"  x2="18" y2="-8"/>
      <line x1="-18" y1="10"  x2="18" y2="10"/>
      <!-- Two vertical bars. -->
      <line x1="-8"  y1="-20" x2="-8" y2="20"/>
      <line x1="8"   y1="-20" x2="8"  y2="20"/>
    </g>
  </g>
</svg>

